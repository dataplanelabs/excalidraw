name: docker

# Builds and pushes excalidraw-canvas + excalidraw-mcp images to Harbor on
# version tags (vX.Y.Z, vX.Y.Z-dpl.N). PRs do build-only.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override tag (e.g., v1.6.2-dpl.0). Leave empty to use git ref.'
        required: false
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: harbor.dataplanelabs.com
  PROJECT: dataplanelabs

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: excalidraw-canvas
            dockerfile: Dockerfile.canvas
          - image: excalidraw-mcp
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=pr-${{ github.event.pull_request.number || 'manual' }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TF_VAR_HARBOR_USERNAME }}
          password: ${{ secrets.TF_VAR_HARBOR_PASSWORD }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ matrix.image }}:${{ steps.tag.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test (canvas only)
        if: matrix.image == 'excalidraw-canvas' && github.event_name == 'pull_request'
        run: |
          docker buildx build --load -f ${{ matrix.dockerfile }} -t canvas-smoke .
          docker run -d --name canvas-smoke -p 3000:3000 canvas-smoke
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break || sleep 1
          done
          curl -sf http://localhost:3000/health
          docker rm -f canvas-smoke
